<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos — Teclado Virtual Accesible</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/games.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="app-container games-app">
        <!-- Top bar -->
        <header class="games-top-bar">
            <button id="back-btn" class="action-btn action-btn-large" aria-label="Volver al teclado">
                <span class="btn-icon">⬅️</span> <span>Volver</span>
            </button>
            <h1 class="games-title">🎮 Juegos</h1>
            <div class="games-top-spacer"></div>
        </header>

        <!-- Game selector -->
        <section class="game-selector" id="game-selector" aria-label="Seleccionar juego">
            <button class="game-card sudoku-card" id="select-sudoku" aria-label="Jugar Sudoku">
                <!-- Mini Sudoku visual -->
                <div class="sudoku-preview" aria-hidden="true">
                    <div class="sp-row">
                        <span class="sp-cell sp-given">5</span>
                        <span class="sp-cell sp-given">3</span>
                        <span class="sp-cell sp-empty"></span>
                        <span class="sp-cell sp-given">6</span>
                    </div>
                    <div class="sp-row">
                        <span class="sp-cell sp-given">6</span>
                        <span class="sp-cell sp-empty"></span>
                        <span class="sp-cell sp-given">1</span>
                        <span class="sp-cell sp-given">9</span>
                    </div>
                    <div class="sp-row">
                        <span class="sp-cell sp-empty"></span>
                        <span class="sp-cell sp-given">9</span>
                        <span class="sp-cell sp-given">8</span>
                        <span class="sp-cell sp-empty"></span>
                    </div>
                    <div class="sp-row">
                        <span class="sp-cell sp-given">8</span>
                        <span class="sp-cell sp-empty"></span>
                        <span class="sp-cell sp-empty"></span>
                        <span class="sp-cell sp-given">6</span>
                    </div>
                </div>
                <span class="game-card-title">Sudoku</span>
                <span class="game-card-desc">Completa la cuadrícula 9×9 con números del 1 al 9</span>
                <div class="dwell-fill"></div>
            </button>
            <button class="game-card solitario-card" id="select-solitario" aria-label="Jugar Solitario">
                <div class="solitario-preview" aria-hidden="true">
                    <span class="preview-card preview-card-back">★</span>
                    <span class="preview-card preview-card-red">A♥</span>
                    <span class="preview-card preview-card-black">K♠</span>
                    <span class="preview-comodin">🃏</span>
                </div>
                <span class="game-card-title">Solitario</span>
                <span class="game-card-desc">Ordena las cartas por pinta con ayuda de Comodin Larroucau</span>
                <div class="dwell-fill"></div>
            </button>
        </section>

        <!-- ============================================== -->
        <!-- SUDOKU GAME                                    -->
        <!-- ============================================== -->
        <section class="game-area sudoku-game-area" id="sudoku-area" style="display:none" aria-label="Juego de Sudoku">
            <div class="sudoku-container">
                <div class="sudoku-board" id="sudoku-board" aria-label="Tablero de Sudoku">
                    <!-- 9x9 grid rendered by JS -->
                </div>
                <aside class="sudoku-side-panel" aria-label="Controles de Sudoku">
                    <div class="game-header">
                        <h2 class="game-name">🔢 Sudoku</h2>
                        <div class="game-controls">
                            <button class="game-btn" id="sudoku-new" aria-label="Nuevo juego">
                                <span>🔄</span> <span>Nuevo</span>
                                <div class="dwell-fill"></div>
                            </button>
                            <button class="game-btn" id="sudoku-check" aria-label="Verificar solución">
                                <span>✅</span> <span>Verificar</span>
                                <div class="dwell-fill"></div>
                            </button>
                            <button class="game-btn" id="sudoku-hint" aria-label="Pista">
                                <span>💡</span> <span>Pista</span>
                                <div class="dwell-fill"></div>
                            </button>
                            <button class="game-btn" id="sudoku-back-to-menu" aria-label="Volver al menú">
                                <span>📋</span> <span>Menú</span>
                                <div class="dwell-fill"></div>
                            </button>
                            <button class="game-btn" id="sudoku-fullscreen" aria-label="Activar pantalla completa">
                                <span>⛶</span> <span>Completa</span>
                                <div class="dwell-fill"></div>
                            </button>
                            <button class="game-btn" id="sudoku-open-emojis" aria-label="Ir a frases rápidas">
                                <span>😀</span> <span>Emojis</span>
                                <div class="dwell-fill"></div>
                            </button>
                            <button class="game-btn" id="sudoku-open-keyboard" aria-label="Ir al teclado virtual">
                                <span>⌨️</span> <span>Teclado</span>
                                <div class="dwell-fill"></div>
                            </button>
                        </div>
                    </div>
                    <div class="sudoku-numpad" id="sudoku-numpad" aria-label="Teclado numérico">
                        <!-- Number buttons 1-9 + erase -->
                    </div>
                    <div class="game-message" id="sudoku-message"></div>
                </aside>
            </div>
        </section>

        <!-- ============================================== -->
        <!-- SOLITARIO GAME                                 -->
        <!-- ============================================== -->
        <section class="game-area" id="solitario-area" style="display:none" aria-label="Juego de Solitario">
            <div class="game-header">
                <h2 class="game-name">🃏 Solitario</h2>
                <div class="game-controls">
                    <button class="game-btn" id="solitario-new" aria-label="Nuevo Solitario">
                        <span>🔄</span> <span>Nuevo</span>
                        <div class="dwell-fill"></div>
                    </button>
                    <button class="game-btn" id="solitario-draw" aria-label="Robar carta o cartas">
                        <span>🂠</span> <span>Robar</span>
                        <div class="dwell-fill"></div>
                    </button>
                    <button class="game-btn" id="solitario-draw-mode" aria-label="Cambiar modo de robo">
                        <span>☰</span> <span id="solitario-draw-mode-label">Robo 3</span>
                        <div class="dwell-fill"></div>
                    </button>
                    <button class="game-btn" id="solitario-undo" aria-label="Deshacer último movimiento">
                        <span>↩️</span> <span>Deshacer</span>
                        <div class="dwell-fill"></div>
                    </button>
                    <button class="game-btn" id="solitario-hint" aria-label="Pista de Comodin Larroucau">
                        <span>🃏</span> <span>Pista</span>
                        <div class="dwell-fill"></div>
                    </button>
                    <button class="game-btn" id="solitario-back-to-menu" aria-label="Volver al menú">
                        <span>📋</span> <span>Menú</span>
                        <div class="dwell-fill"></div>
                    </button>
                    <button class="game-btn" id="solitario-fullscreen" aria-label="Activar pantalla completa">
                        <span>⛶</span> <span>Completa</span>
                        <div class="dwell-fill"></div>
                    </button>
                    <button class="game-btn" id="solitario-open-emojis" aria-label="Ir a frases rápidas">
                        <span>😀</span> <span>Emojis</span>
                        <div class="dwell-fill"></div>
                    </button>
                    <button class="game-btn" id="solitario-open-keyboard" aria-label="Ir al teclado virtual">
                        <span>⌨️</span> <span>Teclado</span>
                        <div class="dwell-fill"></div>
                    </button>
                </div>
            </div>

            <div class="solitario-layout">
                <div class="solitario-status-row">
                    <div class="comodin-panel" aria-live="polite">
                        <div class="comodin-avatar" aria-hidden="true">🃏</div>
                        <div class="comodin-copy">
                            <strong>Comodin Larroucau</strong>
                            <span id="solitario-helper">Elige una carta boca arriba y después el lugar donde quieres moverla.</span>
                        </div>
                    </div>
                    <div class="solitario-score" aria-label="Estado del Solitario">
                        <span>Movimientos: <strong id="solitario-moves">0</strong></span>
                        <span>Robo: <strong id="solitario-stock-count">0</strong></span>
                    </div>
                </div>

                <div class="solitario-top-row">
                    <div class="solitario-draw-area" aria-label="Pila de robo y descarte">
                        <div class="solitario-pile-group">
                            <span class="solitario-pile-label">Robo</span>
                            <div id="solitario-stock" class="solitario-pile"></div>
                        </div>
                        <div class="solitario-pile-group">
                            <span class="solitario-pile-label">Descarte</span>
                            <div id="solitario-waste" class="solitario-pile"></div>
                        </div>
                    </div>

                    <div class="solitario-foundations" id="solitario-foundations" aria-label="Bases">
                        <!-- Rendered by JS -->
                    </div>
                </div>

                <div class="solitario-tableau" id="solitario-tableau" aria-label="Columnas del Solitario">
                    <!-- Rendered by JS -->
                </div>
            </div>

            <div class="game-message" id="solitario-message"></div>
        </section>

    </main>

    <script src="js/fullscreen.js"></script>
    <script src="js/games.js"></script>
</body>
</html>
